    RunnerBudget:
        Type: AWS::Budgets::Budget
        Properties:
            Budget:
                BudgetName: !Sub ${AWS::StackName}-monthly
                BudgetLimit:
                    Amount: !Ref MonthlyBudget
                    Unit: USD
                BudgetType: COST
                CostFilters:
                    TagKeyValue:
                      - user:Project$ReaverOS
                TimeUnit: MONTHLY
            NotificationsWithSubscribers:
              - Notification:
                    ComparisonOperator: GREATER_THAN
                    NotificationType: ACTUAL
                    Threshold: 50
                    ThresholdType: PERCENTAGE
                Subscribers:
                  - Address: !Ref BudgetNotificationEmail
                    SubscriptionType: EMAIL
              - Notification:
                    ComparisonOperator: GREATER_THAN
                    NotificationType: ACTUAL
                    Threshold: 80
                    ThresholdType: PERCENTAGE
                Subscribers:
                  - Address: !Ref BudgetNotificationEmail
                    SubscriptionType: EMAIL
              - Notification:
                    ComparisonOperator: GREATER_THAN
                    NotificationType: ACTUAL
                    Threshold: 100
                    ThresholdType: PERCENTAGE
                Subscribers:
                  - Address: !Ref BudgetNotificationEmail
                    SubscriptionType: EMAIL
              - Notification:
                    ComparisonOperator: GREATER_THAN
                    NotificationType: FORECASTED
                    Threshold: 100
                    ThresholdType: PERCENTAGE
                Subscribers:
                  - Address: !Ref BudgetNotificationEmail
                    SubscriptionType: EMAIL
            ResourceTags:
              - Key: Project
                Value: ReaverOS

