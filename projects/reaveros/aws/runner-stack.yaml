    GitHubActionsRole:
        Type: AWS::IAM::Role
        Properties:
            PermissionsBoundary: !Ref RunnerRolePermissionsBoundaryArn
            AssumeRolePolicyDocument:
                Version: '2012-10-17'
                Statement:
                  - Effect: Allow
                    Principal:
                        Federated: !Ref GitHubOidcProviderArn
                    Action: sts:AssumeRoleWithWebIdentity
                    Condition:
                        StringEquals:
                            token.actions.githubusercontent.com:aud: sts.amazonaws.com
                        StringLike:
                            token.actions.githubusercontent.com:sub:
                              - !Sub repo:${GitHubOidcImmutableRepositoryPattern}:workflow_ref:${GitHubOidcCallerWorkflowReferencePattern}:ref:refs/heads/main:job_workflow_ref:${GitHubOidcWorkflowReference}
                              - !Sub repo:${GitHubOidcImmutableRepositoryPattern}:workflow_ref:${GitHubOidcPullRequestCallerWorkflowReferencePattern}:ref:refs/heads/pull-request/*:job_workflow_ref:${GitHubOidcPullRequestWorkflowReference}
            Policies:
              - PolicyName: ProvisionEphemeralRunner
                PolicyDocument:
                    Version: '2012-10-17'
                    Statement:
                      - Effect: Allow
                        Action: lambda:InvokeFunction
                        Resource: !GetAtt RunnerControlFunction.Arn
                      - Effect: Allow
                        Action: cloudformation:DescribeStacks
                        Resource: !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${AWS::StackName}/*
                      - Effect: Allow
                        Action: ecr:GetAuthorizationToken
                        Resource: '*'
                      - Effect: Allow
                        Action:
                          - ecr:BatchCheckLayerAvailability
                          - ecr:BatchGetImage
                          - ecr:DescribeImages
                          - ecr:DescribeImageScanFindings
                          - ecr:GetDownloadUrlForLayer
                        Resource:
                          - !GetAtt BuildEnvironmentRepository.Arn
                          - !GetAtt UnprunedBuildEnvironmentRepository.Arn
                          - !GetAtt CandidateBuildEnvironmentRepository.Arn
                          - !GetAtt CandidateUnprunedBuildEnvironmentRepository.Arn
                          - !GetAtt StagingBuildEnvironmentRepository.Arn
                          - !GetAtt StagingUnprunedBuildEnvironmentRepository.Arn
                      - Effect: Allow
                        Action:
                          - ecr:BatchCheckLayerAvailability
                          - ecr:CompleteLayerUpload
                          - ecr:InitiateLayerUpload
                          - ecr:PutImage
                          - ecr:UploadLayerPart
                        Resource:
                          - !GetAtt CandidateBuildEnvironmentRepository.Arn
                          - !GetAtt CandidateUnprunedBuildEnvironmentRepository.Arn
                      - Effect: Allow
                        Action:
                          - ecr:BatchCheckLayerAvailability
                          - ecr:CompleteLayerUpload
                          - ecr:InitiateLayerUpload
                          - ecr:PutImage
                          - ecr:UploadLayerPart
                        Resource:
                          - !GetAtt StagingBuildEnvironmentRepository.Arn
                          - !GetAtt StagingUnprunedBuildEnvironmentRepository.Arn
            Tags:
              - Key: Project
                Value: ReaverOS

