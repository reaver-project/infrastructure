AWSTemplateFormatVersion: '2010-09-09'
Description: Ephemeral AWS runners for ReaverOS GitHub Actions

Parameters:
    InfrastructureRevision:
        Type: String
        AllowedPattern: '[0-9a-f]{40}'
    GitHubOidcCallerWorkflowReferencePattern:
        Type: String
        Default: reaver-project/reaveros/.github/workflows/ci.yml@refs/heads/main
    GitHubOidcWorkflowReference:
        Type: String
        Default: reaver-project/reaveros/.github/workflows/aws-*.yml@refs/heads/main
    GitHubOidcPullRequestCallerWorkflowReferencePattern:
        Type: String
        Default: reaver-project/reaveros/.github/workflows/ci.yml@refs/heads/pull-request/*
    GitHubOidcPullRequestWorkflowReference:
        Type: String
        Default: reaver-project/reaveros/.github/workflows/aws-*.yml@refs/heads/pull-request/*
    GitHubOidcImmutableRepositoryPattern:
        Type: String
        Default: reaver-project@1804403/reaveros@*
        AllowedPattern: '[A-Za-z0-9_.-]+@[1-9][0-9]*/[A-Za-z0-9_.-]+@([1-9][0-9]*|\*)'
    GitHubOidcProviderArn:
        Type: String
        Description: ARN of the account-wide GitHub Actions OIDC provider from the control-plane stack.
    GitHubOrganization:
        Type: String
        Default: reaver-project
        AllowedPattern: '[A-Za-z0-9](?:[A-Za-z0-9-]{0,37}[A-Za-z0-9])?'
    GitHubRunnerGroupId:
        Type: Number
        MinValue: 1
    GitHubAllowedRepositories:
        Type: CommaDelimitedList
        Default: reaver-project/reaveros
    CiGateAutomaticActors:
        Type: CommaDelimitedList
        Default: griwes,reaver-project-maintenance[bot]
    RunnerRolePermissionsBoundaryArn:
        Type: String
        Description: ARN of the permissions boundary owned by the control-plane stack.
    RunnerAmiParameter:
        Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
        Default: /aws/service/debian/release/13/latest/amd64
    MediumRunnerInstanceType:
        Type: String
        Default: c8i.4xlarge
        AllowedValues:
          - c8i.4xlarge
          - c8i.8xlarge
          - c8i.12xlarge
    LargeRunnerInstanceType:
        Type: String
        Default: c8i.8xlarge
        AllowedValues:
          - c8i.4xlarge
          - c8i.8xlarge
          - c8i.12xlarge
    MaximumConcurrentRunners:
        Type: Number
        Default: 4
        MinValue: 2
        MaxValue: 16
    RunnerRootVolumeSize:
        Type: Number
        Default: 200
        MinValue: 100
        MaxValue: 500
    RunnerVersion:
        Type: String
        Default: 2.336.0
        AllowedPattern: '[0-9]+\.[0-9]+\.[0-9]+'
    RunnerArchiveSha256:
        Type: String
        Default: 04cf0be1aff4c3ec3554466c39124ca250e3effd8873bb7e8d68535aa9505d5d
        AllowedPattern: '[0-9a-f]{64}'
    RunnerMaximumAgeMinutes:
        Type: Number
        Default: 180
        MinValue: 60
        MaxValue: 360
    BuildEnvironmentRepositoryName:
        Type: String
        Default: reaveros-build-env
        AllowedPattern: '[a-z0-9]+(?:[._/-][a-z0-9]+)*'
    MonthlyBudget:
        Type: Number
        Default: 100
        MinValue: 10
        Description: Monthly ReaverOS cost allocation budget in USD.
    BudgetNotificationEmail:
        Type: String
        AllowedPattern: '[^@\s]+@[^@\s]+\.[^@\s]+'

Resources:
    RunnerVpc:
        Type: AWS::EC2::VPC
        Properties:
            CidrBlock: 10.87.0.0/24
            EnableDnsHostnames: true
            EnableDnsSupport: true
            Tags:
              - Key: Name
                Value: !Sub ${AWS::StackName}-vpc
              - Key: Project
                Value: ReaverOS

    RunnerInternetGateway:
        Type: AWS::EC2::InternetGateway
        Properties:
            Tags:
              - Key: Name
                Value: !Sub ${AWS::StackName}-igw
              - Key: Project
                Value: ReaverOS

    RunnerInternetGatewayAttachment:
        Type: AWS::EC2::VPCGatewayAttachment
        Properties:
            InternetGatewayId: !Ref RunnerInternetGateway
            VpcId: !Ref RunnerVpc

    RunnerSubnet:
        Type: AWS::EC2::Subnet
        Properties:
            VpcId: !Ref RunnerVpc
            CidrBlock: 10.87.0.0/25
            MapPublicIpOnLaunch: true
            Tags:
              - Key: Name
                Value: !Sub ${AWS::StackName}-public
              - Key: Project
                Value: ReaverOS

    RunnerRouteTable:
        Type: AWS::EC2::RouteTable
        Properties:
            VpcId: !Ref RunnerVpc
            Tags:
              - Key: Name
                Value: !Sub ${AWS::StackName}-public
              - Key: Project
                Value: ReaverOS

    RunnerDefaultRoute:
        Type: AWS::EC2::Route
        DependsOn: RunnerInternetGatewayAttachment
        Properties:
            RouteTableId: !Ref RunnerRouteTable
            DestinationCidrBlock: 0.0.0.0/0
            GatewayId: !Ref RunnerInternetGateway

    RunnerSubnetRouteTableAssociation:
        Type: AWS::EC2::SubnetRouteTableAssociation
        Properties:
            RouteTableId: !Ref RunnerRouteTable
            SubnetId: !Ref RunnerSubnet

    RunnerSecurityGroup:
        Type: AWS::EC2::SecurityGroup
        Properties:
            GroupDescription: Outbound-only access for ephemeral GitHub Actions runners
            VpcId: !Ref RunnerVpc
            SecurityGroupEgress:
              - IpProtocol: '-1'
                CidrIp: 0.0.0.0/0
            Tags:
              - Key: Name
                Value: !Sub ${AWS::StackName}-runner
              - Key: Project
                Value: ReaverOS

    BuildEnvironmentRepository:
        Type: AWS::ECR::Repository
        DeletionPolicy: RetainExceptOnCreate
        UpdateReplacePolicy: Retain
        Properties:
            RepositoryName: !Ref BuildEnvironmentRepositoryName
            ImageScanningConfiguration:
                ScanOnPush: true
            ImageTagMutability: IMMUTABLE_WITH_EXCLUSION
            ImageTagMutabilityExclusionFilters:
              - ImageTagMutabilityExclusionFilterType: WILDCARD
                ImageTagMutabilityExclusionFilterValue: latest
            EncryptionConfiguration:
                EncryptionType: AES256
            Tags:
              - Key: Project
                Value: ReaverOS
            LifecyclePolicy:
                LifecyclePolicyText: |
                    {
                        "rules": [{
                            "rulePriority": 1,
                            "description": "Keep the twelve most recent build environments",
                            "selection": {
                                "tagStatus": "any",
                                "countType": "imageCountMoreThan",
                                "countNumber": 12
                            },
                            "action": {"type": "expire"}
                        }]
                    }

    UnprunedBuildEnvironmentRepository:
        Type: AWS::ECR::Repository
        DeletionPolicy: RetainExceptOnCreate
        UpdateReplacePolicy: Retain
        Properties:
            RepositoryName: !Sub ${BuildEnvironmentRepositoryName}-unpruned
            ImageScanningConfiguration:
                ScanOnPush: true
            ImageTagMutability: IMMUTABLE_WITH_EXCLUSION
            ImageTagMutabilityExclusionFilters:
              - ImageTagMutabilityExclusionFilterType: WILDCARD
                ImageTagMutabilityExclusionFilterValue: latest
            EncryptionConfiguration:
                EncryptionType: AES256
            Tags:
              - Key: Project
                Value: ReaverOS
            LifecyclePolicy:
                LifecyclePolicyText: |
                    {
                        "rules": [{
                            "rulePriority": 1,
                            "description": "Keep the six most recent incremental build environments",
                            "selection": {
                                "tagStatus": "any",
                                "countType": "imageCountMoreThan",
                                "countNumber": 6
                            },
                            "action": {"type": "expire"}
                        }]
                    }

    StagingBuildEnvironmentRepository:
        Type: AWS::ECR::Repository
        DeletionPolicy: RetainExceptOnCreate
        UpdateReplacePolicy: Retain
        Properties:
            RepositoryName: !Sub ${BuildEnvironmentRepositoryName}-staging
            ImageScanningConfiguration:
                ScanOnPush: true
            ImageTagMutability: IMMUTABLE
            EncryptionConfiguration:
                EncryptionType: AES256
            Tags:
              - Key: Project
                Value: ReaverOS
            LifecyclePolicy:
                LifecyclePolicyText: |
                    {
                        "rules": [{
                            "rulePriority": 1,
                            "description": "Expire per-run build environments after three days",
                            "selection": {
                                "tagStatus": "any",
                                "countType": "sinceImagePushed",
                                "countUnit": "days",
                                "countNumber": 3
                            },
                            "action": {"type": "expire"}
                        }]
                    }

    StagingUnprunedBuildEnvironmentRepository:
        Type: AWS::ECR::Repository
        DeletionPolicy: RetainExceptOnCreate
        UpdateReplacePolicy: Retain
        Properties:
            RepositoryName: !Sub ${BuildEnvironmentRepositoryName}-unpruned-staging
            ImageScanningConfiguration:
                ScanOnPush: true
            ImageTagMutability: IMMUTABLE
            EncryptionConfiguration:
                EncryptionType: AES256
            Tags:
              - Key: Project
                Value: ReaverOS
            LifecyclePolicy:
                LifecyclePolicyText: |
                    {
                        "rules": [{
                            "rulePriority": 1,
                            "description": "Expire per-run build environments after three days",
                            "selection": {
                                "tagStatus": "any",
                                "countType": "sinceImagePushed",
                                "countUnit": "days",
                                "countNumber": 3
                            },
                            "action": {"type": "expire"}
                        }]
                    }

    CandidateBuildEnvironmentRepository:
        Type: AWS::ECR::Repository
        DeletionPolicy: RetainExceptOnCreate
        UpdateReplacePolicy: Retain
        Properties:
            RepositoryName: !Sub ${BuildEnvironmentRepositoryName}-candidate
            ImageScanningConfiguration:
                ScanOnPush: true
            ImageTagMutability: IMMUTABLE
            EncryptionConfiguration:
                EncryptionType: AES256
            Tags:
              - Key: Project
                Value: ReaverOS
            LifecyclePolicy:
                LifecyclePolicyText: |
                    {
                        "rules": [{
                            "rulePriority": 1,
                            "description": "Expire validated candidate build environments after seven days",
                            "selection": {
                                "tagStatus": "any",
                                "countType": "sinceImagePushed",
                                "countUnit": "days",
                                "countNumber": 7
                            },
                            "action": {"type": "expire"}
                        }]
                    }

    CandidateUnprunedBuildEnvironmentRepository:
        Type: AWS::ECR::Repository
        DeletionPolicy: RetainExceptOnCreate
        UpdateReplacePolicy: Retain
        Properties:
            RepositoryName: !Sub ${BuildEnvironmentRepositoryName}-unpruned-candidate
            ImageScanningConfiguration:
                ScanOnPush: true
            ImageTagMutability: IMMUTABLE
            EncryptionConfiguration:
                EncryptionType: AES256
            Tags:
              - Key: Project
                Value: ReaverOS
            LifecyclePolicy:
                LifecyclePolicyText: |
                    {
                        "rules": [{
                            "rulePriority": 1,
                            "description": "Expire validated candidate build environments after seven days",
                            "selection": {
                                "tagStatus": "any",
                                "countType": "sinceImagePushed",
                                "countUnit": "days",
                                "countNumber": 7
                            },
                            "action": {"type": "expire"}
                        }]
                    }

    CompilerCache:
        Type: AWS::CloudFormation::Stack
        Properties:
            TemplateURL: ../../../aws/compiler-cache/template.yaml
            Parameters:
                BucketName: !Sub reaver-project-reaveros-cache-${AWS::AccountId}-${AWS::Region}
                ProjectTag: ReaverOS
            Tags:
              - Key: Project
                Value: ReaverOS

    RunnerAppSecret:
        Type: AWS::SecretsManager::Secret
        DeletionPolicy: RetainExceptOnCreate
        UpdateReplacePolicy: Retain
        Properties:
            Name: !Sub ${AWS::StackName}/github-runner-app
            Description: GitHub App credentials used only to register ephemeral runners
            GenerateSecretString:
                PasswordLength: 32
                ExcludePunctuation: true
            Tags:
              - Key: Project
                Value: ReaverOS

    RunnerWebhookSecret:
        Type: AWS::SecretsManager::Secret
        DeletionPolicy: RetainExceptOnCreate
        UpdateReplacePolicy: Retain
        Properties:
            Name: !Sub ${AWS::StackName}/github-runner-webhook
            Description: HMAC secret for runner App workflow job deliveries
            GenerateSecretString:
                PasswordLength: 64
                ExcludePunctuation: true
            Tags:
              - Key: Project
                Value: ReaverOS

    CiGateAppSecret:
        Type: AWS::SecretsManager::Secret
        DeletionPolicy: RetainExceptOnCreate
        UpdateReplacePolicy: Retain
        Properties:
            Name: !Sub ${AWS::StackName}/github-ci-gate-app
            Description: GitHub App credentials and webhook secret for exact-revision CI admission
            Tags:
              - Key: Project
                Value: ReaverOS

    CiGateDeadLetterQueue:
        Type: AWS::SQS::Queue
        # A failed update must not delete events already acknowledged by ingress.
        DeletionPolicy: Retain
        UpdateReplacePolicy: Retain
        Properties:
            QueueName: !Sub ${AWS::StackName}-ci-gate-dead-letter.fifo
            FifoQueue: true
            SqsManagedSseEnabled: true
            MessageRetentionPeriod: 1209600
            Tags:
              - Key: Project
                Value: ReaverOS

    CiGateWebhookQueue:
        Type: AWS::SQS::Queue
        DeletionPolicy: Retain
        UpdateReplacePolicy: Retain
        Properties:
            QueueName: !Sub ${AWS::StackName}-ci-gate-events.fifo
            FifoQueue: true
            SqsManagedSseEnabled: true
            VisibilityTimeout: 180
            MessageRetentionPeriod: 345600
            ReceiveMessageWaitTimeSeconds: 20
            RedrivePolicy:
                deadLetterTargetArn: !GetAtt CiGateDeadLetterQueue.Arn
                maxReceiveCount: 5
            Tags:
              - Key: Project
                Value: ReaverOS

    CandidateRunnerDeadLetterQueue:
        Type: AWS::SQS::Queue
        DeletionPolicy: Retain
        UpdateReplacePolicy: Retain
        Properties:
            QueueName: !Sub ${AWS::StackName}-runner-candidate-dead-letter.fifo
            FifoQueue: true
            SqsManagedSseEnabled: true
            MessageRetentionPeriod: 1209600
            Tags:
              - Key: Project
                Value: ReaverOS

    TrustedRunnerDeadLetterQueue:
        Type: AWS::SQS::Queue
        DeletionPolicy: Retain
        UpdateReplacePolicy: Retain
        Properties:
            QueueName: !Sub ${AWS::StackName}-runner-trusted-dead-letter.fifo
            FifoQueue: true
            SqsManagedSseEnabled: true
            MessageRetentionPeriod: 1209600
            Tags:
              - Key: Project
                Value: ReaverOS

    CandidateRunnerWebhookQueue:
        Type: AWS::SQS::Queue
        DeletionPolicy: Retain
        UpdateReplacePolicy: Retain
        Properties:
            QueueName: !Sub ${AWS::StackName}-runner-candidate-events.fifo
            FifoQueue: true
            SqsManagedSseEnabled: true
            VisibilityTimeout: 1800
            MessageRetentionPeriod: 345600
            ReceiveMessageWaitTimeSeconds: 20
            RedrivePolicy:
                deadLetterTargetArn: !GetAtt CandidateRunnerDeadLetterQueue.Arn
                maxReceiveCount: 1000
            Tags:
              - Key: Project
                Value: ReaverOS

    TrustedRunnerWebhookQueue:
        Type: AWS::SQS::Queue
        DeletionPolicy: Retain
        UpdateReplacePolicy: Retain
        Properties:
            QueueName: !Sub ${AWS::StackName}-runner-trusted-events.fifo
            FifoQueue: true
            SqsManagedSseEnabled: true
            VisibilityTimeout: 1800
            MessageRetentionPeriod: 345600
            ReceiveMessageWaitTimeSeconds: 20
            RedrivePolicy:
                deadLetterTargetArn: !GetAtt TrustedRunnerDeadLetterQueue.Arn
                maxReceiveCount: 1000
            Tags:
              - Key: Project
                Value: ReaverOS

    RunnerRole:
        Type: AWS::IAM::Role
        Properties:
            PermissionsBoundary: !Ref RunnerRolePermissionsBoundaryArn
            AssumeRolePolicyDocument:
                Version: '2012-10-17'
                Statement:
                  - Effect: Allow
                    Principal:
                        Service: ec2.amazonaws.com
                    Action: sts:AssumeRole
            Policies:
              - PolicyName: ConsumeJitConfiguration
                PolicyDocument:
                    Version: '2012-10-17'
                    Statement:
                      - Effect: Allow
                        Action:
                          - ssm:GetParameter
                          - ssm:DeleteParameter
                        Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/reaveros/github-runners/jit/*
              - PolicyName: UseBuildEnvironmentCache
                PolicyDocument:
                    Version: '2012-10-17'
                    Statement:
                      - Effect: Allow
                        Action: cloudformation:DescribeStacks
                        Resource: !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${AWS::StackName}/*
                      - Effect: Allow
                        Action: ecr:GetAuthorizationToken
                        Resource: '*'
                      - Effect: Allow
                        Action:
                          - ecr:BatchCheckLayerAvailability
                          - ecr:BatchGetImage
                          - ecr:DescribeImages
                          - ecr:DescribeImageScanFindings
                          - ecr:GetDownloadUrlForLayer
                        Resource:
                          - !GetAtt BuildEnvironmentRepository.Arn
                          - !GetAtt UnprunedBuildEnvironmentRepository.Arn
                          - !GetAtt CandidateBuildEnvironmentRepository.Arn
                          - !GetAtt CandidateUnprunedBuildEnvironmentRepository.Arn
                          - !GetAtt StagingBuildEnvironmentRepository.Arn
                          - !GetAtt StagingUnprunedBuildEnvironmentRepository.Arn
            Tags:
              - Key: Project
                Value: ReaverOS

    BuilderRuntimePolicy:
        Type: AWS::IAM::ManagedPolicy
        Properties:
            PolicyDocument:
                Version: '2012-10-17'
                Statement:
                  - Effect: Allow
                    Action:
                      - ssm:GetParameter
                      - ssm:DeleteParameter
                    Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/reaveros/github-runners/jit/*
                  - Effect: Allow
                    Action: cloudformation:DescribeStacks
                    Resource: !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${AWS::StackName}/*
                  - Effect: Allow
                    Action: ecr:GetAuthorizationToken
                    Resource: '*'
                  - Effect: Allow
                    Action:
                      - ecr:BatchCheckLayerAvailability
                      - ecr:BatchGetImage
                      - ecr:DescribeImages
                      - ecr:GetDownloadUrlForLayer
                    Resource:
                      - !GetAtt BuildEnvironmentRepository.Arn
                      - !GetAtt UnprunedBuildEnvironmentRepository.Arn
                      - !GetAtt CandidateBuildEnvironmentRepository.Arn
                      - !GetAtt CandidateUnprunedBuildEnvironmentRepository.Arn
                      - !GetAtt StagingBuildEnvironmentRepository.Arn
                      - !GetAtt StagingUnprunedBuildEnvironmentRepository.Arn
                  - Effect: Allow
                    Action:
                      - ecr:BatchCheckLayerAvailability
                      - ecr:CompleteLayerUpload
                      - ecr:InitiateLayerUpload
                      - ecr:PutImage
                      - ecr:UploadLayerPart
                    Resource:
                      - !GetAtt StagingBuildEnvironmentRepository.Arn
                      - !GetAtt StagingUnprunedBuildEnvironmentRepository.Arn

    BuilderRunnerRole:
        Type: AWS::IAM::Role
        Properties:
            PermissionsBoundary: !Ref RunnerRolePermissionsBoundaryArn
            AssumeRolePolicyDocument:
                Version: '2012-10-17'
                Statement:
                  - Effect: Allow
                    Principal:
                        Service: ec2.amazonaws.com
                    Action: sts:AssumeRole
            ManagedPolicyArns:
              - !Ref BuilderRuntimePolicy
            Policies:
              - PolicyName: CandidateCompilerCache
                PolicyDocument:
                    Version: '2012-10-17'
                    Statement:
                      - Effect: Allow
                        Action:
                          - s3:GetObject
                          - s3:PutObject
                        Resource: !Sub arn:${AWS::Partition}:s3:::reaver-project-reaveros-cache-${AWS::AccountId}-${AWS::Region}/candidate/*
            Tags:
              - Key: Project
                Value: ReaverOS

    TrustedBuilderRunnerRole:
        Type: AWS::IAM::Role
        Properties:
            PermissionsBoundary: !Ref RunnerRolePermissionsBoundaryArn
            AssumeRolePolicyDocument:
                Version: '2012-10-17'
                Statement:
                  - Effect: Allow
                    Principal:
                        Service: ec2.amazonaws.com
                    Action: sts:AssumeRole
            ManagedPolicyArns:
              - !Ref BuilderRuntimePolicy
            Policies:
              - PolicyName: TrustedCompilerCache
                PolicyDocument:
                    Version: '2012-10-17'
                    Statement:
                      - Effect: Allow
                        Action:
                          - s3:GetObject
                          - s3:PutObject
                        Resource: !Sub arn:${AWS::Partition}:s3:::reaver-project-reaveros-cache-${AWS::AccountId}-${AWS::Region}/trusted/*
            Tags:
              - Key: Project
                Value: ReaverOS

    RunnerInstanceProfile:
        Type: AWS::IAM::InstanceProfile
        Properties:
            Roles:
              - !Ref RunnerRole

    BuilderRunnerInstanceProfile:
        Type: AWS::IAM::InstanceProfile
        Properties:
            Roles:
              - !Ref BuilderRunnerRole

    TrustedBuilderRunnerInstanceProfile:
        Type: AWS::IAM::InstanceProfile
        Properties:
            Roles:
              - !Ref TrustedBuilderRunnerRole

    RunnerLaunchTemplate:
        Type: AWS::EC2::LaunchTemplate
        Properties:
            TagSpecifications:
              - ResourceType: launch-template
                Tags:
                  - Key: Project
                    Value: ReaverOS
            LaunchTemplateData:
                BlockDeviceMappings:
                  - DeviceName: /dev/xvda
                    Ebs:
                        DeleteOnTermination: true
                        Encrypted: true
                        VolumeSize: !Ref RunnerRootVolumeSize
                        VolumeType: gp3
                CpuOptions:
                    NestedVirtualization: enabled
                IamInstanceProfile:
                    Arn: !GetAtt RunnerInstanceProfile.Arn
                ImageId: !Ref RunnerAmiParameter
                InstanceInitiatedShutdownBehavior: terminate
                InstanceType: !Ref MediumRunnerInstanceType
                MetadataOptions:
                    HttpEndpoint: enabled
                    HttpPutResponseHopLimit: 1
                    HttpTokens: required
                    InstanceMetadataTags: enabled
                NetworkInterfaces:
                  - AssociatePublicIpAddress: true
                    DeleteOnTermination: true
                    DeviceIndex: 0
                    Groups:
                      - !Ref RunnerSecurityGroup
                    SubnetId: !Ref RunnerSubnet
                UserData:
                    Fn::Base64: !Sub |
                        #!/usr/bin/env bash
                        set -euo pipefail
                        exec > >(tee /var/log/reaveros-actions-runner.log | logger -t reaveros-actions-runner -s 2>/dev/console) 2>&1

                        shutdown -P +${RunnerMaximumAgeMinutes}
                        trap 'shutdown -P now' EXIT

                        export DEBIAN_FRONTEND=noninteractive
                        apt-get update
                        apt-get install --yes awscli ca-certificates curl docker.io git jq ovmf qemu-system-x86
                        systemctl enable --now docker

                        useradd --create-home --shell /bin/bash actions-runner
                        usermod --append --groups docker,kvm actions-runner

                        metadata_token=$(curl --fail --silent --show-error \
                            --request PUT \
                            --header 'X-aws-ec2-metadata-token-ttl-seconds: 21600' \
                            http://169.254.169.254/latest/api/token)
                        jit_parameter=$(curl --fail --silent --show-error \
                            --header "X-aws-ec2-metadata-token: $metadata_token" \
                            http://169.254.169.254/latest/meta-data/tags/instance/ReaverOSRunnerParameter)
                        jit_config=$(aws ssm get-parameter \
                            --region ${AWS::Region} \
                            --name "$jit_parameter" \
                            --with-decryption \
                            --query Parameter.Value \
                            --output text)
                        aws ssm delete-parameter --region ${AWS::Region} --name "$jit_parameter"

                        install --directory --owner actions-runner --group actions-runner /opt/actions-runner
                        cd /opt/actions-runner
                        curl --fail --location --retry 5 \
                            --output actions-runner.tar.gz \
                            https://github.com/actions/runner/releases/download/v${RunnerVersion}/actions-runner-linux-x64-${RunnerVersion}.tar.gz
                        printf '%s  %s\n' '${RunnerArchiveSha256}' actions-runner.tar.gz | sha256sum --check
                        tar --extract --gzip --file actions-runner.tar.gz
                        rm actions-runner.tar.gz
                        ./bin/installdependencies.sh
                        chown --recursive actions-runner:actions-runner /opt/actions-runner

                        runuser --user actions-runner -- ./run.sh --jitconfig "$jit_config"

    RunnerControlRole:
        Type: AWS::IAM::Role
        Properties:
            PermissionsBoundary: !Ref RunnerRolePermissionsBoundaryArn
            AssumeRolePolicyDocument:
                Version: '2012-10-17'
                Statement:
                  - Effect: Allow
                    Principal:
                        Service: lambda.amazonaws.com
                    Action: sts:AssumeRole
            ManagedPolicyArns:
              - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
            Policies:
              - PolicyName: ControlEphemeralRunners
                PolicyDocument:
                    Version: '2012-10-17'
                    Statement:
                      - Effect: Allow
                        Action:
                          - ec2:DescribeInstances
                          - ec2:GetConsoleOutput
                        Resource: '*'
                      - Effect: Allow
                        Action: ec2:RunInstances
                        Resource: '*'
                        Condition:
                            ArnEquals:
                                ec2:LaunchTemplate: !Sub arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:launch-template/${RunnerLaunchTemplate}
                      - Effect: Allow
                        Action: ec2:CreateTags
                        Resource:
                          - !Sub arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/*
                          - !Sub arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:volume/*
                        Condition:
                            StringEquals:
                                ec2:CreateAction: RunInstances
                      - Effect: Allow
                        Action: ec2:TerminateInstances
                        Resource: !Sub arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/*
                        Condition:
                            StringEquals:
                                ec2:ResourceTag/ReaverOSPurpose: GitHubActionsRunner
                            StringEqualsIfExists:
                                ec2:ResourceTag/ReaverProjectCacheTrust: candidate
                      - Effect: Allow
                        Action: iam:PassRole
                        Resource:
                          - !GetAtt BuilderRunnerRole.Arn
                          - !GetAtt RunnerRole.Arn
                        Condition:
                            StringEquals:
                                iam:PassedToService: ec2.amazonaws.com
                      - Effect: Allow
                        Action: secretsmanager:GetSecretValue
                        Resource: !Ref RunnerAppSecret
                      - Effect: Allow
                        Action:
                          - sqs:ChangeMessageVisibility
                          - sqs:DeleteMessage
                          - sqs:GetQueueAttributes
                          - sqs:ReceiveMessage
                        Resource: !GetAtt CandidateRunnerWebhookQueue.Arn
                      - Effect: Allow
                        Action: sqs:SendMessage
                        Resource: !GetAtt CandidateRunnerDeadLetterQueue.Arn
                      - Effect: Allow
                        Action:
                          - ssm:DeleteParameter
                          - ssm:PutParameter
                        Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/reaveros/github-runners/jit/*
            Tags:
              - Key: Project
                Value: ReaverOS

    TrustedRunnerControlRole:
        Type: AWS::IAM::Role
        Properties:
            PermissionsBoundary: !Ref RunnerRolePermissionsBoundaryArn
            AssumeRolePolicyDocument:
                Version: '2012-10-17'
                Statement:
                  - Effect: Allow
                    Principal:
                        Service: lambda.amazonaws.com
                    Action: sts:AssumeRole
            ManagedPolicyArns:
              - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
            Policies:
              - PolicyName: ControlTrustedEphemeralRunners
                PolicyDocument:
                    Version: '2012-10-17'
                    Statement:
                      - Effect: Allow
                        Action:
                          - ec2:DescribeInstances
                          - ec2:GetConsoleOutput
                        Resource: '*'
                      - Effect: Allow
                        Action: ec2:RunInstances
                        Resource: '*'
                        Condition:
                            ArnEquals:
                                ec2:LaunchTemplate: !Sub arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:launch-template/${RunnerLaunchTemplate}
                      - Effect: Allow
                        Action: ec2:CreateTags
                        Resource:
                          - !Sub arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/*
                          - !Sub arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:volume/*
                        Condition:
                            StringEquals:
                                ec2:CreateAction: RunInstances
                      - Effect: Allow
                        Action: ec2:TerminateInstances
                        Resource: !Sub arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/*
                        Condition:
                            StringEquals:
                                ec2:ResourceTag/ReaverOSPurpose: GitHubActionsRunner
                                ec2:ResourceTag/ReaverProjectCacheTrust: trusted
                      - Effect: Allow
                        Action: iam:PassRole
                        Resource:
                          - !GetAtt TrustedBuilderRunnerRole.Arn
                          - !GetAtt RunnerRole.Arn
                        Condition:
                            StringEquals:
                                iam:PassedToService: ec2.amazonaws.com
                      - Effect: Allow
                        Action: secretsmanager:GetSecretValue
                        Resource: !Ref RunnerAppSecret
                      - Effect: Allow
                        Action:
                          - sqs:ChangeMessageVisibility
                          - sqs:DeleteMessage
                          - sqs:GetQueueAttributes
                          - sqs:ReceiveMessage
                        Resource: !GetAtt TrustedRunnerWebhookQueue.Arn
                      - Effect: Allow
                        Action: sqs:SendMessage
                        Resource: !GetAtt TrustedRunnerDeadLetterQueue.Arn
                      - Effect: Allow
                        Action: secretsmanager:GetSecretValue
                        Resource: !Ref RunnerWebhookSecret
                      - Effect: Allow
                        Action:
                          - ssm:DeleteParameter
                          - ssm:PutParameter
                        Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/reaveros/github-runners/jit/*
            Tags:
              - Key: Project
                Value: ReaverOS

