name: Set up infrastructure validation
description: Install the repository-owned pre-commit validation environment.

runs:
    using: composite
    steps:
      - name: Install Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
            python-version: '3.15'

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
            version: '0.13.6'
            enable-cache: true
            cache-dependency-glob: aws/uv.lock
            cache-suffix: ${{ github.job }}

      - name: Restore pre-commit environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
            path: ~/.cache/pre-commit
            key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
            restore-keys: |
                pre-commit-${{ runner.os }}-

      - name: Install pre-commit
        shell: bash
        run: python3 -m pip install pre-commit==4.6.1
