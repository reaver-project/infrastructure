name: Analyze infrastructure security posture

on:
    pull_request:
    push:
        branches:
          - main
    schedule:
      - cron: '37 6 * * 1'
    workflow_dispatch:

permissions: {}

concurrency:
    group: security-analysis-${{ github.ref }}
    cancel-in-progress: true

jobs:
    actions_security:
        name: Analyze GitHub Actions security
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: read
            security-events: write

        steps:
          - name: Harden the runner
            uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
            with:
                egress-policy: audit

          - name: Check out infrastructure
            uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
            with:
                persist-credentials: false

          - name: Analyze workflows and actions with zizmor
            uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
            with:
                collect: all
                online-audits: true
                version: 1.32.0

    scorecard:
        name: Analyze repository security posture
        if: ${{ github.event_name != 'pull_request' }}
        runs-on: ubuntu-latest
        timeout-minutes: 15
        permissions:
            actions: read
            checks: read
            contents: read
            id-token: write
            issues: read
            pull-requests: read
            security-events: write

        steps:
          - name: Harden the runner
            uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
            with:
                egress-policy: audit

          - name: Check out infrastructure
            uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
            with:
                persist-credentials: false

          - name: Analyze repository with OpenSSF Scorecard
            uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
            with:
                results_file: scorecard.sarif
                results_format: sarif
                publish_results: true

          - name: Upload Scorecard findings to code scanning
            uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
            with:
                category: openssf-scorecard
                sarif_file: scorecard.sarif
