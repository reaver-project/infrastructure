name: Analyze infrastructure security posture

on:
    pull_request:
    push:
        branches:
          - main
    schedule:
      - cron: '37 6 * * 1'
    workflow_dispatch:

permissions: {}

concurrency:
    group: security-analysis-${{ github.ref }}
    cancel-in-progress: true

jobs:
    actions_security:
        name: Analyze GitHub Actions security
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: read
            security-events: write

        steps:
          - name: Check out infrastructure
            uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
            with:
                persist-credentials: false

          - name: Analyze workflows and actions with zizmor
            uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
            with:
                collect: all
                online-audits: true
                version: 1.29.0

    scorecard:
        name: Analyze repository security posture
        if: ${{ github.event_name != 'pull_request' }}
        runs-on: ubuntu-latest
        timeout-minutes: 15
        permissions:
            actions: read
            checks: read
            contents: read
            id-token: write
            issues: read
            pull-requests: read
            security-events: write

        steps:
          - name: Check out infrastructure
            uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
            with:
                persist-credentials: false

          - name: Analyze repository with OpenSSF Scorecard
            uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
            with:
                results_file: scorecard.sarif
                results_format: sarif
                publish_results: true

          - name: Upload Scorecard findings to code scanning
            uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
            with:
                category: openssf-scorecard
                sarif_file: scorecard.sarif
