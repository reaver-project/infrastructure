name: Deploy AWS infrastructure

run-name: Deploy AWS plan ${{ inputs.plan_key }}

on:
    workflow_dispatch:
        inputs:
            plan_key:
                description: Opaque lookup key from the reviewed private AWS plan
                required: true
                type: string

permissions:
    contents: read

concurrency:
    group: reaveros-aws-infrastructure
    cancel-in-progress: false

jobs:
    validate:
        name: Revalidate before deployment
        uses: ./.github/workflows/validate.yml

    deploy:
        name: Apply the reviewed ReaverOS AWS change set
        needs: validate
        runs-on: ubuntu-latest
        timeout-minutes: 30
        environment: aws-production
        permissions:
            contents: read
            id-token: write
        env:
            AWS_DEPLOYMENT_ARTIFACT_BUCKET: ${{ vars.AWS_DEPLOYMENT_ARTIFACT_BUCKET }}
            AWS_REGION: ${{ vars.AWS_REGION }}
            AWS_RUNNER_STACK_NAME: ${{ vars.AWS_RUNNER_STACK_NAME }}
            PLAN_KEY: ${{ inputs.plan_key }}
        outputs:
            contract_version: ${{ steps.stack.outputs.contract_version }}
            infrastructure_revision: ${{ steps.stack.outputs.infrastructure_revision }}
            runner_role_arn: ${{ steps.stack.outputs.runner_role_arn }}

        steps:
          - name: Harden the runner
            uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
            with:
                egress-policy: audit

          - name: Check out infrastructure
            uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
            with:
                persist-credentials: false

          - name: Authenticate to AWS for deployment
            uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
            with:
                aws-region: ${{ env.AWS_REGION }}
                role-to-assume: ${{ vars.AWS_INFRASTRUCTURE_DEPLOY_ROLE_ARN }}
                role-session-name: infrastructure-deploy-${{ github.run_id }}

          - name: Read and verify the private plan
            id: plan
            run: projects/reaveros/aws/read-plan "${PLAN_KEY}"

          - name: Execute the reviewed change set
            env:
                CHANGE_SET_ARN: ${{ steps.plan.outputs.change_set_arn }}
            run: projects/reaveros/aws/deploy-infrastructure "${CHANGE_SET_ARN}"

          - name: Read the deployed ReaverOS contract
            id: stack
            run: projects/reaveros/aws/read-deployed-contract
