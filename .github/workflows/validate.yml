name: Validate infrastructure

on:
    pull_request:
    workflow_call:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    static_analysis:
        name: Lint infrastructure code and configuration
        runs-on: ubuntu-latest
        timeout-minutes: 15

        steps:
          - name: Check out infrastructure
            uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
            with:
                persist-credentials: false

          - name: Set up validation tools
            uses: ./.github/actions/setup-validation

          - name: Run static analysis and configuration validation
            env:
                SKIP: infrastructure-tests,runner-control-coverage,pip-audit,pip-compile,gitleaks
            run: pre-commit run --all-files

    behavior_tests:
        name: Test infrastructure behavior and runner coverage
        runs-on: ubuntu-latest
        timeout-minutes: 15

        steps:
          - name: Check out infrastructure
            uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
            with:
                persist-credentials: false

          - name: Set up validation tools
            uses: ./.github/actions/setup-validation

          - name: Enforce runner-controller branch coverage
            run: pre-commit run runner-control-coverage --all-files

          - name: Run infrastructure tests
            run: pre-commit run infrastructure-tests --all-files

    supply_chain:
        name: Audit dependencies and committed history
        runs-on: ubuntu-latest
        timeout-minutes: 15

        steps:
          - name: Check out complete infrastructure history
            uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
            with:
                fetch-depth: 0
                persist-credentials: false

          - name: Set up validation tools
            uses: ./.github/actions/setup-validation

          - name: Verify the compiled dependency lock
            run: |
                pre-commit run lambda-dependency-lock --all-files
                pre-commit run policy-validation-dependency-lock --all-files

          - name: Audit Python dependencies
            run: |
                pre-commit run lambda-dependency-audit --all-files
                pre-commit run policy-validation-dependency-audit --all-files

          - name: Scan the worktree for secrets
            run: pre-commit run gitleaks --all-files

          - name: Scan complete committed history for secrets
            run: pre-commit run gitleaks-history --hook-stage manual --all-files

    dependency_review:
        name: Review dependency changes
        if: github.event_name == 'pull_request'
        runs-on: ubuntu-latest
        timeout-minutes: 10

        steps:
          - name: Check out infrastructure
            uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
            with:
                persist-credentials: false

          - name: Reject newly vulnerable dependencies
            uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
            with:
                fail-on-severity: moderate
                show-openssf-scorecard: false
                show-patched-versions: true

    validation:
        name: Test infrastructure code and policy
        if: ${{ always() }}
        needs:
          - static_analysis
          - behavior_tests
          - supply_chain
          - dependency_review
        runs-on: ubuntu-latest
        timeout-minutes: 5

        steps:
          - name: Require every validation partition to pass
            env:
                STATIC_ANALYSIS_RESULT: ${{ needs.static_analysis.result }}
                BEHAVIOR_TESTS_RESULT: ${{ needs.behavior_tests.result }}
                DEPENDENCY_REVIEW_RESULT: ${{ needs.dependency_review.result }}
                SUPPLY_CHAIN_RESULT: ${{ needs.supply_chain.result }}
            run: |
                if [[ ${STATIC_ANALYSIS_RESULT} != success \
                    || ${BEHAVIOR_TESTS_RESULT} != success \
                    || ( ${DEPENDENCY_REVIEW_RESULT} != success \
                        && ${DEPENDENCY_REVIEW_RESULT} != skipped ) \
                    || ${SUPPLY_CHAIN_RESULT} != success ]]
                then
                    printf 'Validation failed: static=%s behavior=%s dependency-review=%s supply-chain=%s\n' \
                        "${STATIC_ANALYSIS_RESULT}" \
                        "${BEHAVIOR_TESTS_RESULT}" \
                        "${DEPENDENCY_REVIEW_RESULT}" \
                        "${SUPPLY_CHAIN_RESULT}" >&2
                    exit 1
                fi
