name: Validate infrastructure

on:
    pull_request:
    workflow_call:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    validate:
        name: Test infrastructure code and policy
        runs-on: ubuntu-latest
        timeout-minutes: 15

        steps:
          - name: Check out infrastructure
            uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
            with:
                fetch-depth: 0
                persist-credentials: false

          - name: Install Python
            uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
            with:
                python-version: '3.13'

          - name: Install validation tools
            run: python3 -m pip install pre-commit==4.6.1

          - name: Run validation and tests
            run: pre-commit run --all-files

          - name: Scan committed history for secrets
            run: pre-commit run gitleaks-history --hook-stage manual --all-files
