name: Plan AWS infrastructure

on:
    push:
        branches:
          - main
        paths:
          - .github/workflows/aws-infrastructure.yml
          - .github/workflows/aws-infrastructure-deploy.yml
          - aws/policy-validation-requirements.in
          - aws/policy-validation-requirements.txt
          - projects/reaveros/aws/**
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: reaveros-aws-infrastructure
    cancel-in-progress: false

jobs:
    validate:
        name: Validate before planning
        uses: ./.github/workflows/validate.yml

    plan:
        name: Create a ReaverOS AWS change set
        needs: validate
        runs-on: ubuntu-latest
        timeout-minutes: 20
        permissions:
            contents: read
            id-token: write
        env:
            AWS_BUDGET_NOTIFICATION_EMAIL: ${{ vars.AWS_BUDGET_NOTIFICATION_EMAIL }}
            AWS_CLOUDFORMATION_EXECUTION_ROLE_ARN: ${{ vars.AWS_CLOUDFORMATION_EXECUTION_ROLE_ARN }}
            AWS_DEPLOYMENT_ARTIFACT_BUCKET: ${{ vars.AWS_DEPLOYMENT_ARTIFACT_BUCKET }}
            AWS_GITHUB_OIDC_PROVIDER_ARN: ${{ vars.AWS_GITHUB_OIDC_PROVIDER_ARN }}
            AWS_GITHUB_OIDC_REPOSITORY_SUBJECT_PATTERN: ${{ vars.AWS_GITHUB_OIDC_REPOSITORY_SUBJECT_PATTERN }}
            AWS_GITHUB_RUNNER_GROUP_ID: ${{ vars.AWS_GITHUB_RUNNER_GROUP_ID }}
            AWS_REGION: ${{ vars.AWS_REGION }}
            AWS_RUNNER_ROLE_PERMISSIONS_BOUNDARY_ARN: ${{ vars.AWS_RUNNER_ROLE_PERMISSIONS_BOUNDARY_ARN }}
            AWS_RUNNER_STACK_NAME: ${{ vars.AWS_RUNNER_STACK_NAME }}

        steps:
          - name: Harden the runner
            uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
            with:
                egress-policy: audit

          - name: Check out infrastructure
            uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
            with:
                persist-credentials: false

          - name: Install Python
            uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
            with:
                python-version: '3.15'

          - name: Install the IAM policy validator
            run: |
                python3 -m pip install \
                    --only-binary=:all: \
                    --require-hashes \
                    --requirement aws/policy-validation-requirements.txt

          - name: Authenticate to AWS for planning
            uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
            with:
                aws-region: ${{ env.AWS_REGION }}
                role-to-assume: ${{ vars.AWS_INFRASTRUCTURE_PLAN_ROLE_ARN }}
                role-session-name: infrastructure-plan-${{ github.run_id }}

          - name: Validate IAM policies with Access Analyzer
            run: projects/reaveros/aws/validate-policies projects/reaveros/aws/runner-stack.yaml

          - name: Package Lambda functions
            run: projects/reaveros/aws/package-functions build/reaveros-lambda

          - name: Create the reviewed change set
            id: plan
            run: |
                projects/reaveros/aws/plan-infrastructure \
                    projects/reaveros/aws/runner-stack.yaml \
                    "${AWS_RUNNER_STACK_NAME}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          - name: Explain how to apply the plan
            if: steps.plan.outputs.has_changes == 'true'
            env:
                PLAN_KEY: ${{ steps.plan.outputs.plan_key }}
            run: |
                {
                    printf '\n### Approval\n\n'
                    printf 'After reviewing the private change set in AWS, manually run '
                    printf '\x60Deploy AWS infrastructure\x60 with lookup key \x60%s\x60.\n' \
                        "${PLAN_KEY}"
                } >> "${GITHUB_STEP_SUMMARY}"
