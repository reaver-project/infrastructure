name: Publish ReaverOS build environments to GHCR

on:
    schedule:
      - cron: '13 * * * *'
    workflow_dispatch:
        inputs:
            reserve_packages:
                description: Reserve the private GHCR package names before enabling ReaverOS CI
                required: false
                default: false
                type: boolean

permissions:
    contents: read

concurrency:
    group: reaveros-ghcr-publisher
    cancel-in-progress: false

jobs:
    reserve:
        name: Reserve GHCR package names
        if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.reserve_packages
        runs-on: ubuntu-latest
        timeout-minutes: 15
        permissions:
            contents: read
            packages: write
        steps:
          - name: Harden the runner
            uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
            with:
                egress-policy: audit

          - name: Check out infrastructure
            uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
            with:
                persist-credentials: false

          - name: Reserve private package names
            env:
                GHCR_TOKEN: ${{ github.token }}
            run: projects/reaveros/ghcr/reserve

    publish:
        name: Publish validated ReaverOS main images
        if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || !inputs.reserve_packages) && vars.AWS_GHCR_PUBLISHER_ROLE_ARN != ''
        runs-on: ubuntu-latest
        timeout-minutes: 40
        permissions:
            contents: read
            id-token: write
            packages: write
        steps:
          - name: Harden the runner
            uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
            with:
                egress-policy: audit

          - name: Check out infrastructure
            uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
            with:
                persist-credentials: false

          - name: Read the deployed ReaverOS stack
            id: stack
            uses: ./actions/aws-stack-contract
            with:
                aws-region: ${{ vars.AWS_REGION }}
                expected-contract-version: '4'
                role-arn: ${{ vars.AWS_GHCR_PUBLISHER_ROLE_ARN }}
                role-session-name: reaveros-ghcr-${{ github.run_id }}
                stack-name: ${{ vars.AWS_RUNNER_STACK_NAME }}

          - name: Install the registry copy client
            run: |
                sudo apt-get update
                sudo apt-get install --yes skopeo

          - name: Reconcile GHCR with successful ReaverOS main CI
            env:
                AWS_REGION: ${{ vars.AWS_REGION }}
                BUILD_ENVIRONMENT: ${{ fromJSON(steps.stack.outputs.outputs).BuildEnvironmentRepositoryUri }}
                GH_TOKEN: ${{ github.token }}
                GHCR_TOKEN: ${{ github.token }}
                UNPRUNED_BUILD_ENVIRONMENT: ${{ fromJSON(steps.stack.outputs.outputs).UnprunedBuildEnvironmentRepositoryUri }}
            run: projects/reaveros/ghcr/publish
