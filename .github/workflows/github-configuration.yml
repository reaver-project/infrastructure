name: Deploy GitHub configuration

on:
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: github-configuration
    cancel-in-progress: false

jobs:
    validate:
        name: Revalidate before deployment
        uses: ./.github/workflows/validate.yml

    deploy:
        name: Converge organization and repository settings
        needs: validate
        runs-on: ubuntu-latest
        timeout-minutes: 15
        environment: github-production

        steps:
          - name: Harden the runner
            uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
            with:
                egress-policy: audit

          - name: Check out infrastructure
            uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
            with:
                persist-credentials: false

          - name: Create an infrastructure App token
            id: app
            uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
            with:
                client-id: ${{ vars.INFRASTRUCTURE_APP_CLIENT_ID }}
                private-key: ${{ secrets.INFRASTRUCTURE_APP_PRIVATE_KEY }}
                owner: reaver-project
                repositories: infrastructure
                permission-actions: write
                permission-administration: write
                permission-environments: write
                permission-members: read
                permission-organization-administration: write

          - name: Converge organization policy
            env:
                GH_TOKEN: ${{ steps.app.outputs.token }}
            run: github/configure-organization github/organizations/reaver-project.json

          - name: Converge infrastructure repository policy
            env:
                GH_TOKEN: ${{ steps.app.outputs.token }}
            run: github/configure-repository github/repositories/infrastructure.json

    reaveros:
        name: Converge ReaverOS repository policy
        needs: deploy
        runs-on: ubuntu-latest
        timeout-minutes: 15
        environment: github-production

        steps:
          - name: Harden the runner
            uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
            with:
                egress-policy: audit

          - name: Check out infrastructure
            uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
            with:
                persist-credentials: false

          - name: Create a ReaverOS-scoped infrastructure App token
            id: app
            uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
            with:
                client-id: ${{ vars.INFRASTRUCTURE_APP_CLIENT_ID }}
                private-key: ${{ secrets.INFRASTRUCTURE_APP_PRIVATE_KEY }}
                owner: reaver-project
                repositories: reaveros
                permission-actions: write
                permission-administration: write
                permission-environments: write
                permission-members: read

          - name: Converge ReaverOS repository policy
            env:
                CI_GATE_APP_ID: ${{ vars.CI_GATE_APP_ID }}
                GH_TOKEN: ${{ steps.app.outputs.token }}
            run: github/configure-repository github/repositories/reaveros.json
