      RunnerControlFunction:
        Type: AWS::Lambda::Function
        Properties:
          ReservedConcurrentExecutions: 1
          Timeout: 300
      CiGateFunction:
        Type: AWS::Lambda::Function
        Properties:
          ReservedConcurrentExecutions: 9
          Timeout: 15
      CiGateWorkerFunction:
        Type: AWS::Lambda::Function
        Properties:
          ReservedConcurrentExecutions: 2
          Timeout: 30
      CiGateWebhookQueue:
        Type: AWS::SQS::Queue
        DeletionPolicy: Retain
        UpdateReplacePolicy: Retain
        Properties:
          FifoQueue: false
          SqsManagedSseEnabled: true
          MessageRetentionPeriod: 345600
      CiGateDeadLetterQueue:
        Type: AWS::SQS::Queue
        DeletionPolicy: Retain
        UpdateReplacePolicy: Retain
        Properties:
          FifoQueue: false
          SqsManagedSseEnabled: true
          MessageRetentionPeriod: 1209600
      CiGateWorkerEventSource:
        Type: AWS::Lambda::EventSourceMapping
        Properties:
          BatchSize: 2
  expectations:
    rules:
      lambda_functions_are_bounded: FAIL
      ci_gate_ingress_and_worker_have_distinct_limits: FAIL
      ci_gate_delivery_is_fifo_and_serial: FAIL
      sqs_queues_are_encrypted_and_retained: PASS
