AWSTemplateFormatVersion: '2010-09-09'
Description: Trust boundary for automated Reaver Project AWS infrastructure deployment

Parameters:
    BootstrapRevision:
        Type: String
        AllowedPattern: '[0-9a-f]{40}'
    BootstrapTemplateSha256:
        Type: String
        AllowedPattern: '[0-9a-f]{64}'
    GitHubDefaultBranch:
        Type: String
        Default: main
        AllowedPattern: '[A-Za-z0-9._/-]+'
    GitHubOidcPlanWorkflowReference:
        Type: String
        Default: reaver-project/infrastructure/.github/workflows/aws-infrastructure.yml@refs/heads/main
    GitHubOidcDeployWorkflowReference:
        Type: String
        Default: reaver-project/infrastructure/.github/workflows/aws-infrastructure-deploy.yml@refs/heads/main
    GitHubOidcProviderArn:
        Type: String
        Default: ''
        Description: Leave empty to create the account-wide GitHub Actions OIDC provider.
    InfrastructureAccessAnalyzerArn:
        Type: String
        Default: ''
        Description: Leave empty to create the regional account access analyzer.
    DeploymentPlanAuditLogBucketName:
        Type: String
        AllowedPattern: '[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]'
    BuildEnvironmentRepositoryName:
        Type: String
        Default: reaveros-build-env
        AllowedPattern: '[a-z0-9]+(?:[._/-][a-z0-9]+)*'
    RunnerStackName:
        Type: String
        Default: reaveros-github-runners
        AllowedPattern: '[a-zA-Z][-a-zA-Z0-9]*'

Conditions:
    CreateGitHubOidcProvider: !Equals [!Ref GitHubOidcProviderArn, '']
    CreateInfrastructureAccessAnalyzer: !Equals [!Ref InfrastructureAccessAnalyzerArn, '']

Resources:
    DeploymentArtifactBucket:
        Type: AWS::S3::Bucket
        DeletionPolicy: Retain
        UpdateReplacePolicy: Retain
        Properties:
            BucketEncryption:
                ServerSideEncryptionConfiguration:
                  - ServerSideEncryptionByDefault:
                        SSEAlgorithm: AES256
            LifecycleConfiguration:
                Rules:
                  - Id: ExpireDeploymentPlans
                    Prefix: plans/
                    Status: Enabled
                    ExpirationInDays: 30
                    NoncurrentVersionExpiration:
                        NoncurrentDays: 30
                  - Id: ExpireDeploymentArtifacts
                    Status: Enabled
                    ExpirationInDays: 365
                    NoncurrentVersionExpiration:
                        NoncurrentDays: 90
            OwnershipControls:
                Rules:
                  - ObjectOwnership: BucketOwnerEnforced
            PublicAccessBlockConfiguration:
                BlockPublicAcls: true
                BlockPublicPolicy: true
                IgnorePublicAcls: true
                RestrictPublicBuckets: true
            VersioningConfiguration:
                Status: Enabled
            Tags:
              - Key: Project
                Value: ReaverProjectInfrastructure

    DeploymentArtifactBucketPolicy:
        Type: AWS::S3::BucketPolicy
        Properties:
            Bucket: !Ref DeploymentArtifactBucket
            PolicyDocument:
                Version: '2012-10-17'
                Statement:
                  - Sid: RequireTransportEncryption
                    Effect: Deny
                    Principal: '*'
                    Action: s3:*
                    Resource:
                      - !GetAtt DeploymentArtifactBucket.Arn
                      - !Sub ${DeploymentArtifactBucket.Arn}/*
                    Condition:
                        Bool:
                            aws:SecureTransport: false
                  - Sid: RequireImmutableDeploymentPlans
                    Effect: Deny
                    Principal: '*'
                    Action: s3:PutObject
                    Resource: !Sub ${DeploymentArtifactBucket.Arn}/plans/*
                    Condition:
                        'Null':
                            s3:if-none-match: true

    DeploymentPlanAuditTrail:
        Type: AWS::CloudTrail::Trail
        Properties:
            TrailName: !Sub ${AWS::StackName}-deployment-plan-audit
            EnableLogFileValidation: true
            EventSelectors:
              - DataResources:
                  - Type: AWS::S3::Object
                    Values:
                      - !Sub ${DeploymentArtifactBucket.Arn}/plans/
                IncludeManagementEvents: false
                ReadWriteType: All
            IncludeGlobalServiceEvents: false
            IsLogging: true
            IsMultiRegionTrail: false
            S3BucketName: !Ref DeploymentPlanAuditLogBucketName
            S3KeyPrefix: cloudtrail
            Tags:
              - Key: Project
                Value: ReaverProjectInfrastructure

    GitHubOidcProvider:
        Type: AWS::IAM::OIDCProvider
        Condition: CreateGitHubOidcProvider
        DeletionPolicy: Retain
        UpdateReplacePolicy: Retain
        Properties:
            Url: https://token.actions.githubusercontent.com
            ClientIdList:
              - sts.amazonaws.com
            Tags:
              - Key: Project
                Value: ReaverProjectInfrastructure

    InfrastructureAccessAnalyzer:
        Type: AWS::AccessAnalyzer::Analyzer
        Condition: CreateInfrastructureAccessAnalyzer
        DeletionPolicy: Retain
        UpdateReplacePolicy: Retain
        Properties:
            AnalyzerName: !Sub ${AWS::StackName}-external-access
            Type: ACCOUNT
            Tags:
              - Key: Project
                Value: ReaverProjectInfrastructure

    RunnerRolePermissionsBoundary:
        Type: AWS::IAM::ManagedPolicy
        Properties:
            Description: Maximum permissions available to roles in the ReaverOS runner stack
            PolicyDocument:
                Version: '2012-10-17'
                Statement:
                  - Effect: Allow
                    Action:
                      - logs:CreateLogGroup
                      - logs:CreateLogStream
                      - logs:PutLogEvents
                    Resource:
                      - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${RunnerStackName}-*
                      - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${RunnerStackName}-*:*
                  - Effect: Allow
                    Action:
                      - ec2:CreateTags
                      - ec2:DescribeInstances
                      - ec2:GetConsoleOutput
                      - ec2:RunInstances
                      - ec2:TerminateInstances
                    Resource: '*'
                  - Effect: Allow
                    Action: ecr:GetAuthorizationToken
                    Resource: '*'
                  - Effect: Allow
                    Action:
                      - ecr:BatchCheckLayerAvailability
                      - ecr:BatchGetImage
                      - ecr:CompleteLayerUpload
                      - ecr:DescribeImages
                      - ecr:DescribeImageScanFindings
                      - ecr:GetDownloadUrlForLayer
                      - ecr:InitiateLayerUpload
                      - ecr:PutImage
                      - ecr:UploadLayerPart
                    Resource: !Sub arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/${BuildEnvironmentRepositoryName}*
                  - Effect: Allow
                    Action:
                      - ssm:DeleteParameter
                      - ssm:GetParameter
                      - ssm:PutParameter
                    Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/reaveros/github-runners/jit/*
                  - Effect: Allow
                    Action: lambda:InvokeFunction
                    Resource: !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${RunnerStackName}-*
                  - Effect: Allow
                    Action: secretsmanager:GetSecretValue
                    Resource: !Sub arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${RunnerStackName}/github-runner-app-*
                  - Effect: Allow
                    Action: cloudformation:DescribeStacks
                    Resource: !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${RunnerStackName}/*
                  - Effect: Allow
                    Action: iam:PassRole
                    Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${RunnerStackName}-*
                    Condition:
                        StringEquals:
                            iam:PassedToService: ec2.amazonaws.com

    CloudFormationExecutionRole:
        Type: AWS::IAM::Role
        Properties:
            AssumeRolePolicyDocument:
                Version: '2012-10-17'
                Statement:
                  - Effect: Allow
                    Principal:
                        Service: cloudformation.amazonaws.com
                    Action: sts:AssumeRole
            Policies:
              - PolicyName: ManageRunnerInfrastructure
                PolicyDocument:
                    Version: '2012-10-17'
                    Statement:
                      - Effect: Allow
                        Action:
                          - ssm:GetParameter
                          - ssm:GetParameters
                        Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}::parameter/aws/service/debian/release/*
                      - Effect: Allow
                        Action: s3:GetObject
                        Resource: !Sub ${DeploymentArtifactBucket.Arn}/${RunnerStackName}/*
                      - Effect: Allow
                        Action:
                          - ec2:AssociateRouteTable
                          - ec2:AttachInternetGateway
                          - ec2:AuthorizeSecurityGroupEgress
                          - ec2:CreateInternetGateway
                          - ec2:CreateLaunchTemplate
                          - ec2:CreateLaunchTemplateVersion
                          - ec2:CreateRoute
                          - ec2:CreateRouteTable
                          - ec2:CreateSecurityGroup
                          - ec2:CreateSubnet
                          - ec2:CreateTags
                          - ec2:CreateVpc
                          - ec2:DeleteInternetGateway
                          - ec2:DeleteLaunchTemplate
                          - ec2:DeleteLaunchTemplateVersions
                          - ec2:DeleteRoute
                          - ec2:DeleteRouteTable
                          - ec2:DeleteSecurityGroup
                          - ec2:DeleteSubnet
                          - ec2:DeleteTags
                          - ec2:DeleteVpc
                          - ec2:DescribeAccountAttributes
                          - ec2:DescribeAvailabilityZones
                          - ec2:DescribeImages
                          - ec2:DescribeInternetGateways
                          - ec2:DescribeLaunchTemplateVersions
                          - ec2:DescribeLaunchTemplates
                          - ec2:DescribeNetworkInterfaces
                          - ec2:DescribeRouteTables
                          - ec2:DescribeSecurityGroupRules
                          - ec2:DescribeSecurityGroups
                          - ec2:DescribeSubnets
                          - ec2:DescribeTags
                          - ec2:DescribeVpcs
                          - ec2:DescribeVpcAttribute
                          - ec2:DetachInternetGateway
                          - ec2:DisassociateRouteTable
                          - ec2:ModifyLaunchTemplate
                          - ec2:ModifySecurityGroupRules
                          - ec2:ModifySubnetAttribute
                          - ec2:ModifyVpcAttribute
                          - ec2:ReplaceRoute
                          - ec2:ReplaceRouteTableAssociation
                          - ec2:RevokeSecurityGroupEgress
                        Resource: '*'
                      - Effect: Allow
                        Action:
                          - ecr:CreateRepository
                          - ecr:DeleteLifecyclePolicy
                          - ecr:DeleteRepository
                          - ecr:DescribeRepositories
                          - ecr:GetLifecyclePolicy
                          - ecr:GetRepositoryPolicy
                          - ecr:ListTagsForResource
                          - ecr:PutImageScanningConfiguration
                          - ecr:PutImageTagMutability
                          - ecr:PutLifecyclePolicy
                          - ecr:SetRepositoryPolicy
                          - ecr:TagResource
                          - ecr:UntagResource
                        Resource: !Sub arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/${BuildEnvironmentRepositoryName}*
                      - Effect: Allow
                        Action: secretsmanager:GetRandomPassword
                        Resource: '*'
                      - Effect: Allow
                        Action:
                          - secretsmanager:CreateSecret
                          - secretsmanager:DeleteSecret
                          - secretsmanager:DescribeSecret
                          - secretsmanager:GetSecretValue
                          - secretsmanager:ListSecretVersionIds
                          - secretsmanager:PutSecretValue
                          - secretsmanager:RestoreSecret
                          - secretsmanager:TagResource
                          - secretsmanager:UntagResource
                          - secretsmanager:UpdateSecret
                          - secretsmanager:UpdateSecretVersionStage
                        Resource: !Sub arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${RunnerStackName}/github-runner-app-*
                      - Effect: Allow
                        Action:
                          - iam:AttachRolePolicy
                          - iam:DeleteRole
                          - iam:DeleteRolePolicy
                          - iam:DetachRolePolicy
                          - iam:GetRole
                          - iam:GetRolePolicy
                          - iam:ListAttachedRolePolicies
                          - iam:ListInstanceProfilesForRole
                          - iam:ListRolePolicies
                          - iam:PutRolePolicy
                          - iam:TagRole
                          - iam:UntagRole
                          - iam:UpdateAssumeRolePolicy
                          - iam:UpdateRole
                          - iam:UpdateRoleDescription
                        Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${RunnerStackName}-*
                      - Effect: Allow
                        Action:
                          - iam:CreateRole
                          - iam:PutRolePermissionsBoundary
                        Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${RunnerStackName}-*
                        Condition:
                            ArnEquals:
                                iam:PermissionsBoundary: !Ref RunnerRolePermissionsBoundary
                      - Effect: Allow
                        Action:
                          - iam:AddRoleToInstanceProfile
                          - iam:CreateInstanceProfile
                          - iam:DeleteInstanceProfile
                          - iam:GetInstanceProfile
                          - iam:RemoveRoleFromInstanceProfile
                          - iam:TagInstanceProfile
                          - iam:UntagInstanceProfile
                        Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:instance-profile/${RunnerStackName}-*
                      - Effect: Allow
                        Action:
                          - iam:GetPolicy
                          - iam:GetPolicyVersion
                        Resource: !Ref RunnerRolePermissionsBoundary
                      - Effect: Allow
                        Action: iam:PassRole
                        Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${RunnerStackName}-*
                        Condition:
                            StringEquals:
                                iam:PassedToService:
                                  - ec2.amazonaws.com
                                  - lambda.amazonaws.com
                      - Effect: Allow
                        Action:
                          - lambda:AddPermission
                          - lambda:CreateFunction
                          - lambda:DeleteFunction
                          - lambda:DeleteFunctionConcurrency
                          - lambda:GetFunction
                          - lambda:GetFunctionConfiguration
                          - lambda:GetPolicy
                          - lambda:ListTags
                          - lambda:PutFunctionConcurrency
                          - lambda:RemovePermission
                          - lambda:TagResource
                          - lambda:UntagResource
                          - lambda:UpdateFunctionCode
                          - lambda:UpdateFunctionConfiguration
                        Resource: !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${RunnerStackName}-*
                      - Effect: Allow
                        Action:
                          - logs:CreateLogGroup
                          - logs:DescribeLogGroups
                        Resource: '*'
                      - Effect: Allow
                        Action:
                          - logs:DeleteLogGroup
                          - logs:DeleteRetentionPolicy
                          - logs:ListTagsForResource
                          - logs:PutRetentionPolicy
                          - logs:TagResource
                          - logs:UntagResource
                        Resource:
                          - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${RunnerStackName}-*
                          - !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${RunnerStackName}-*:*
                      - Effect: Allow
                        Action:
                          - events:DeleteRule
                          - events:DescribeRule
                          - events:ListTagsForResource
                          - events:ListTargetsByRule
                          - events:PutRule
                          - events:PutTargets
                          - events:RemoveTargets
                          - events:TagResource
                          - events:UntagResource
                        Resource: !Sub arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:rule/${RunnerStackName}-*
                      - Effect: Allow
                        Action:
                          - cloudwatch:DeleteAlarms
                          - cloudwatch:DescribeAlarms
                          - cloudwatch:PutMetricAlarm
                          - cloudwatch:TagResource
                          - cloudwatch:UntagResource
                        Resource: !Sub arn:${AWS::Partition}:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:${RunnerStackName}-*
                      - Effect: Allow
                        Action:
                          - sns:CreateTopic
                          - sns:DeleteTopic
                          - sns:GetTopicAttributes
                          - sns:ListSubscriptionsByTopic
                          - sns:ListTagsForResource
                          - sns:SetTopicAttributes
                          - sns:Subscribe
                          - sns:TagResource
                          - sns:Unsubscribe
                          - sns:UntagResource
                        Resource: !Sub arn:${AWS::Partition}:sns:${AWS::Region}:${AWS::AccountId}:${RunnerStackName}-*
                      - Effect: Allow
                        Action:
                          - budgets:ListTagsForResource
                          - budgets:ModifyBudget
                          - budgets:TagResource
                          - budgets:UntagResource
                          - budgets:ViewBudget
                        Resource: !Sub arn:${AWS::Partition}:budgets::${AWS::AccountId}:budget/${RunnerStackName}-monthly
                      - Effect: Allow
                        Action:
                          - aws-portal:ModifyBilling
                          - aws-portal:ViewBilling
                          - billing:GetBillingViewData
                        Resource: '*'
                      - Effect: Allow
                        Action: iam:CreateServiceLinkedRole
                        Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/aws-service-role/budgets.amazonaws.com/*
                        Condition:
                            StringEquals:
                                iam:AWSServiceName: budgets.amazonaws.com
            Tags:
              - Key: Project
                Value: ReaverProjectInfrastructure

    InfrastructurePlanRole:
        Type: AWS::IAM::Role
        Properties:
            AssumeRolePolicyDocument:
                Version: '2012-10-17'
                Statement:
                  - Effect: Allow
                    Principal:
                        Federated: !If
                          - CreateGitHubOidcProvider
                          - !Ref GitHubOidcProvider
                          - !Ref GitHubOidcProviderArn
                    Action: sts:AssumeRoleWithWebIdentity
                    Condition:
                        StringEquals:
                            token.actions.githubusercontent.com:aud: sts.amazonaws.com
                            token.actions.githubusercontent.com:sub: !Sub workflow_ref:${GitHubOidcPlanWorkflowReference}:ref:refs/heads/${GitHubDefaultBranch}
            Policies:
              - PolicyName: PlanRunnerInfrastructure
                PolicyDocument:
                    Version: '2012-10-17'
                    Statement:
                      - Effect: Allow
                        Action: cloudformation:CreateChangeSet
                        Resource: !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${RunnerStackName}/*
                        Condition:
                            StringEquals:
                                cloudformation:RoleARN: !GetAtt CloudFormationExecutionRole.Arn
                            StringLike:
                                cloudformation:ChangeSetName: !Sub ${RunnerStackName}-*
                      - Effect: Allow
                        Action:
                          - cloudformation:DescribeStacks
                          - cloudformation:DescribeStackEvents
                          - cloudformation:GetTemplate
                          - cloudformation:ListChangeSets
                        Resource: !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${RunnerStackName}/*
                      - Effect: Allow
                        Action:
                          - cloudformation:DeleteChangeSet
                          - cloudformation:DescribeChangeSet
                        Resource: !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${RunnerStackName}/*
                        Condition:
                            StringLike:
                                cloudformation:ChangeSetName:
                                  - !Sub ${RunnerStackName}-*
                                  - !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:changeSet/${RunnerStackName}-*/*
                      - Effect: Allow
                        Action:
                          - cloudformation:GetTemplateSummary
                          - cloudformation:ValidateTemplate
                        Resource: '*'
                      - Effect: Allow
                        Action:
                          - ssm:GetParameter
                          - ssm:GetParameters
                        Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}::parameter/aws/service/debian/release/*
                      - Effect: Allow
                        Action:
                          - iam:GetPolicy
                          - iam:GetPolicyVersion
                        Resource: !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
                      - Effect: Allow
                        Action:
                          - access-analyzer:ListAnalyzers
                          - access-analyzer:ValidatePolicy
                          - s3:ListAllMyBuckets
                        Resource: '*'
                      - Effect: Allow
                        Action:
                          - access-analyzer:CreateAccessPreview
                          - access-analyzer:GetAccessPreview
                          - access-analyzer:ListAccessPreviewFindings
                        Resource: !If
                          - CreateInfrastructureAccessAnalyzer
                          - !GetAtt InfrastructureAccessAnalyzer.Arn
                          - !Ref InfrastructureAccessAnalyzerArn
                      - Effect: Allow
                        Action:
                          - s3:GetBucketLocation
                          - s3:ListBucket
                        Resource: !GetAtt DeploymentArtifactBucket.Arn
                      - Effect: Allow
                        Action:
                          - s3:GetObject
                          - s3:PutObject
                        Resource: !Sub ${DeploymentArtifactBucket.Arn}/${RunnerStackName}/*
                      - Effect: Allow
                        Action: s3:PutObject
                        Resource: !Sub ${DeploymentArtifactBucket.Arn}/plans/*
                      - Effect: Allow
                        Action: iam:PassRole
                        Resource: !GetAtt CloudFormationExecutionRole.Arn
                        Condition:
                            StringEquals:
                                iam:PassedToService: cloudformation.amazonaws.com
            Tags:
              - Key: Project
                Value: ReaverProjectInfrastructure

    InfrastructureDeployRole:
        Type: AWS::IAM::Role
        Properties:
            AssumeRolePolicyDocument:
                Version: '2012-10-17'
                Statement:
                  - Effect: Allow
                    Principal:
                        Federated: !If
                          - CreateGitHubOidcProvider
                          - !Ref GitHubOidcProvider
                          - !Ref GitHubOidcProviderArn
                    Action: sts:AssumeRoleWithWebIdentity
                    Condition:
                        StringEquals:
                            token.actions.githubusercontent.com:aud: sts.amazonaws.com
                            token.actions.githubusercontent.com:sub: !Sub workflow_ref:${GitHubOidcDeployWorkflowReference}:environment:aws-production
            Policies:
              - PolicyName: DeployRunnerInfrastructure
                PolicyDocument:
                    Version: '2012-10-17'
                    Statement:
                      - Effect: Allow
                        Action: s3:GetObject
                        Resource: !Sub ${DeploymentArtifactBucket.Arn}/plans/*
                      - Effect: Allow
                        Action:
                          - cloudformation:DescribeStacks
                          - cloudformation:DescribeStackEvents
                          - cloudformation:ExecuteChangeSet
                          - cloudformation:UpdateTerminationProtection
                        Resource: !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${RunnerStackName}/*
                      - Effect: Allow
                        Action: cloudformation:DescribeChangeSet
                        Resource: !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${RunnerStackName}/*
                        Condition:
                            StringLike:
                                cloudformation:ChangeSetName:
                                  - !Sub ${RunnerStackName}-*
                                  - !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:changeSet/${RunnerStackName}-*/*
            Tags:
              - Key: Project
                Value: ReaverProjectInfrastructure

Outputs:
    BootstrapRevision:
        Value: !Ref BootstrapRevision
    BootstrapTemplateSha256:
        Value: !Ref BootstrapTemplateSha256
    CloudFormationExecutionRoleArn:
        Value: !GetAtt CloudFormationExecutionRole.Arn
    DeploymentArtifactBucketName:
        Value: !Ref DeploymentArtifactBucket
    GitHubOidcProviderArn:
        Value: !If
          - CreateGitHubOidcProvider
          - !Ref GitHubOidcProvider
          - !Ref GitHubOidcProviderArn
    InfrastructureDeployRoleArn:
        Value: !GetAtt InfrastructureDeployRole.Arn
    InfrastructureAccessAnalyzerArn:
        Value: !If
          - CreateInfrastructureAccessAnalyzer
          - !GetAtt InfrastructureAccessAnalyzer.Arn
          - !Ref InfrastructureAccessAnalyzerArn
    InfrastructurePlanRoleArn:
        Value: !GetAtt InfrastructurePlanRole.Arn
    RunnerRolePermissionsBoundaryArn:
        Value: !Ref RunnerRolePermissionsBoundary
    RunnerStackName:
        Value: !Ref RunnerStackName
