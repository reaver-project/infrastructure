[project]
name = "reaver-project-aws-tools"
version = "0.0.0"
requires-python = ">=3.13"
dependencies = [
    "boto3==1.43.93",
]

[project.scripts]
reaver-project-aws-organization = "reaver_project_aws.organization:main"
reaver-project-aws-cost-controls = "reaver_project_aws.cost_controls:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reaver_project_aws"]
