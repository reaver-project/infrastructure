minimum_pre_commit_version: 4.6.1
default_install_hook_types: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-json
      - id: pretty-format-json
        args: [--autofix, --indent=4, --no-sort-keys]
      - id: check-yaml
        args: [--unsafe]
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=no]
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: aab412d509121cb5f7533134b7e67f9fab59c682  # v0.16.4
    hooks:
      - id: ruff-check

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: 745eface02aef23e168a8afb6b5737818efbea95  # v0.11.0.1
    hooks:
      - id: shellcheck

  - repo: https://github.com/aws-cloudformation/cfn-lint
    rev: f76cd1d1fa0291e97a7b6c7ea09531e02a53fdd3  # v1.54.0
    hooks:
      - id: cfn-lint-rc

  - repo: https://github.com/rhysd/actionlint
    rev: 914e7df21a07ef503a81201c76d2b11c789d3fca  # v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: 451b56af716f9f0d0c2b816503a3fd0cf8b036fa  # v1.29.0
    hooks:
      - id: zizmor

  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 12e63946db2c5cfcc9030fac21c3883ba88c6ed8  # 0.38.0
    hooks:
      - id: check-metaschema
        files: ^schemas/.*\.schema\.json$
      - id: check-jsonschema
        name: Validate GitHub App manifests
        files: ^github/apps/[^/]+/manifest\.json$
        args:
          - --schemafile
          - schemas/github-app-manifest.schema.json
      - id: check-jsonschema
        name: Validate GitHub organization configuration
        files: ^github/organizations/.*\.json$
        args:
          - --schemafile
          - schemas/github-organization.schema.json
      - id: check-jsonschema
        name: Validate GitHub repository configuration
        files: ^github/repositories/.*\.json$
        args:
          - --schemafile
          - schemas/github-repository.schema.json
      - id: check-jsonschema
        name: Validate private plan fixtures
        files: ^projects/reaveros/aws/testdata/private-plan.*\.json$
        args:
          - --schemafile
          - schemas/private-plan.schema.json
      - id: check-jsonschema
        alias: repository-json-schema-tests
        name: Test repository JSON schemas
        entry: python schemas/test.py
        files: ^(schemas/.*\.schema\.json|github/apps/[^/]+/manifest\.json|github/organizations/.*\.json|github/repositories/.*\.json|projects/reaveros/aws/testdata/private-plan.*\.json)$
        pass_filenames: false
      - id: check-jsonschema
        name: Validate CodeRabbit configuration
        files: ^\.coderabbit\.yaml$
        args:
          - --schemafile
          - https://coderabbit.ai/integrations/schema.v2.json

  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e  # v8.30.1
    hooks:
      - id: gitleaks
      - id: gitleaks
        alias: gitleaks-history
        name: Detect secrets in committed history
        entry: gitleaks git
        args:
          - --redact
          - --no-banner
          - --log-opts=--no-textconv --full-history HEAD --diff-filter=ACMR
        stages: [manual]

  - repo: https://github.com/pypa/pip-audit
    rev: 8894eb8cee033531a1fbd9f2fb160892531c14e3  # v2.10.1
    hooks:
      - id: pip-audit
        name: Audit Lambda Python dependencies
        args:
          - --requirement
          - projects/reaveros/aws/functions/runner-control/requirements.txt
          - --require-hashes
          - --progress-spinner
          - 'off'
        files: ^projects/reaveros/aws/functions/runner-control/requirements\.(in|txt)$
        pass_filenames: false

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 5900cba2cfe6d20f562458d4d308ac55569f92eb  # 0.12.0
    hooks:
      - id: pip-compile
        name: Compile Lambda Python dependency lock
        args:
          - --generate-hashes
          - '--only-binary=:all:'
          - --python-platform=x86_64-manylinux_2_34
          - --python-version=3.13
          - --output-file=projects/reaveros/aws/functions/runner-control/requirements.txt
          - projects/reaveros/aws/functions/runner-control/requirements.in
        files: ^projects/reaveros/aws/functions/runner-control/requirements\.(in|txt)$
        pass_filenames: false

  - repo: local
    hooks:
      - id: infrastructure-tests
        name: Run infrastructure tests
        entry: ./test
        language: system
        pass_filenames: false
        always_run: true
