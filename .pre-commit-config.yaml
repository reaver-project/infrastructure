minimum_pre_commit_version: 4.6.1
default_install_hook_types: [pre-commit]

ci:
  skip:
    - cfn-lint-rc
    - coderabbit-schema
    - renovate-schema
    - lambda-dependency-audit
    - policy-validation-dependency-audit
    - aws-sdk-dependency-audit
    - lambda-dependency-lock
    - policy-validation-dependency-lock
    - aws-sdk-lock
    - cloudformation-guard
    - infrastructure-tests

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0  # v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-json
      - id: check-toml
      - id: pretty-format-json
        args: [--autofix, --indent=4, --no-sort-keys]
      - id: check-yaml
        args: [--unsafe]
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=no]
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.8  # v0.16.4
    hooks:
      - id: ruff-check
      - id: ruff-format

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1-1  # v0.11.0.1
    hooks:
      - id: shellcheck

  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.14.1-1  # v3.13.1-1
    hooks:
      - id: shfmt
        args:
          - --write
          - --indent
          - '4'
          - --case-indent
          - --space-redirects
          - --func-next-line

  - repo: https://github.com/aws-cloudformation/cfn-lint
    rev: v1.57.0  # v1.54.0
    hooks:
      - id: cfn-lint-rc

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12  # v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.30.1  # v1.29.0
    hooks:
      - id: zizmor

  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.38.0  # 0.38.0
    hooks:
      - id: check-metaschema
        files: ^schemas/.*\.schema\.json$
      - id: check-jsonschema
        name: Validate GitHub App manifests
        files: ^github/apps/[^/]+/manifest\.json$
        args:
          - --schemafile
          - schemas/github-app-manifest.schema.json
      - id: check-jsonschema
        name: Validate AWS organization configuration
        files: ^aws/organization/reaver-project\.json$
        args:
          - --schemafile
          - schemas/aws-organization.schema.json
      - id: check-jsonschema
        name: Validate AWS cost controls
        files: ^aws/organization/cost-controls\.json$
        args:
          - --schemafile
          - schemas/aws-cost-controls.schema.json
      - id: check-jsonschema
        name: Validate GitHub organization configuration
        files: ^github/organizations/.*\.json$
        args:
          - --schemafile
          - schemas/github-organization.schema.json
      - id: check-jsonschema
        name: Validate GitHub repository configuration
        files: ^github/repositories/.*\.json$
        args:
          - --schemafile
          - schemas/github-repository.schema.json
      - id: check-jsonschema
        name: Validate control-plane plan fixtures
        files: ^aws/control-plane/testdata/private-plan.*\.json$
        args:
          - --schemafile
          - schemas/control-plane-plan.schema.json
      - id: check-jsonschema
        name: Validate private plan fixtures
        files: ^projects/reaveros/aws/testdata/private-plan.*\.json$
        args:
          - --schemafile
          - schemas/private-plan.schema.json
      - id: check-jsonschema
        alias: repository-json-schema-tests
        name: Test repository JSON schemas
        entry: python schemas/test.py
        files: ^(schemas/.*\.schema\.json|aws/control-plane/testdata/private-plan.*\.json|aws/organization/.*\.json|github/apps/[^/]+/manifest\.json|github/organizations/.*\.json|github/repositories/.*\.json|projects/reaveros/aws/testdata/private-plan.*\.json)$
        pass_filenames: false
      - id: check-jsonschema
        alias: coderabbit-schema
        name: Validate CodeRabbit configuration
        files: ^\.coderabbit\.yaml$
        args:
          - --schemafile
          - https://coderabbit.ai/integrations/schema.v2.json
      - id: check-jsonschema
        alias: renovate-schema
        name: Validate Renovate configuration
        files: ^renovate\.json$
        args:
          - --schemafile
          - https://docs.renovatebot.com/renovate-schema.json

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0  # v8.30.1
    hooks:
      - id: gitleaks
      - id: gitleaks
        alias: gitleaks-history
        name: Detect secrets in committed history
        entry: gitleaks git
        args:
          - --redact
          - --no-banner
          - --log-opts=--no-textconv --full-history HEAD --diff-filter=ACMR
        stages: [manual]

  - repo: https://github.com/pypa/pip-audit
    rev: v2.10.1  # v2.10.1
    hooks:
      - id: pip-audit
        name: Audit Lambda Python dependencies
        alias: lambda-dependency-audit
        args:
          - --requirement
          - projects/reaveros/aws/functions/runner-control/requirements.txt
          - --require-hashes
          - --progress-spinner
          - 'off'
        files: ^projects/reaveros/aws/functions/runner-control/requirements\.(in|txt)$
        pass_filenames: false
      - id: pip-audit
        name: Audit IAM policy validator dependencies
        alias: policy-validation-dependency-audit
        args:
          - --requirement
          - aws/policy-validation-requirements.txt
          - --require-hashes
          - --progress-spinner
          - 'off'
        files: ^aws/policy-validation-requirements\.(in|txt)$
        pass_filenames: false
      - id: pip-audit
        name: Audit AWS SDK dependencies
        alias: aws-sdk-dependency-audit
        entry: aws/audit-dependencies
        files: ^aws/(pyproject\.toml|uv\.lock)$
        pass_filenames: false

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.12.17  # 0.12.0
    hooks:
      - id: pip-compile
        name: Compile Lambda Python dependency lock
        alias: lambda-dependency-lock
        args:
          - --output-file=projects/reaveros/aws/functions/runner-control/requirements.txt
          - projects/reaveros/aws/functions/runner-control/requirements.in
        files: ^projects/reaveros/aws/functions/runner-control/requirements\.(in|txt)$
        pass_filenames: false
      - id: pip-compile
        name: Compile IAM policy validator dependency lock
        alias: policy-validation-dependency-lock
        args:
          - --output-file=aws/policy-validation-requirements.txt
          - aws/policy-validation-requirements.in
        files: ^aws/policy-validation-requirements\.(in|txt)$
        pass_filenames: false

  - repo: local
    hooks:
      - id: aws-sdk-lock
        name: Verify the AWS SDK lock
        entry: uv lock --project aws --check
        language: system
        files: ^aws/(pyproject\.toml|uv\.lock)$
        pass_filenames: false
      - id: cloudformation-guard
        name: Enforce CloudFormation security invariants
        entry: aws/validate-guard-rules
        language: system
        files: ^(aws/(cfn-guard|control-plane/template\.yaml|guard/.*|organization/log-archive/template\.yaml|validate-guard-rules)|projects/reaveros/aws/runner-stack\.yaml)$
        pass_filenames: false
      - id: runner-control-coverage
        name: Test runner controller with branch coverage
        entry: projects/reaveros/aws/functions/runner-control/test-coverage
        language: python
        additional_dependencies:
          - coverage==7.15.4
        files: ^projects/reaveros/aws/functions/runner-control/.*\.py$
        pass_filenames: false
      - id: ci-gate-coverage
        name: Test CI gate with branch coverage
        entry: projects/reaveros/aws/functions/ci-gate/test-coverage
        language: python
        additional_dependencies:
          - coverage==7.15.4
        files: ^projects/reaveros/aws/functions/(ci-gate/.*\.py|github_app\.py)$
        pass_filenames: false
      - id: infrastructure-tests
        name: Run infrastructure tests
        entry: ./test
        language: system
        pass_filenames: false
        always_run: true
